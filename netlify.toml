[build]
  publish = "."

# ── Security headers (all pages) ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "no-referrer"
    Cache-Control           = "no-cache"

# ── No-cache for JS, CSS and HTML ────────────────────────────────────────────
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Pretty URLs ───────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/registro"
  to     = "/registro.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/index.html#admin"
  status = 302

# ── SPA fallback (must be last) ───────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
